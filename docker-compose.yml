# 学習用のテストメールサーバ(GreenMail)。メールはメモリ上にだけ保持され、外部へは配送されない。
services:
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=me:password@example.test
        -Dgreenmail.users.login=email
    ports:
      - "127.0.0.1:3025:3025" # SMTP
      - "127.0.0.1:3143:3143" # IMAP
