<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Shiori Mail">
  <title>Shiori Mail</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16788a"/>
      <stop offset="1" stop-color="#0b4b57"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f08a4b"/>
      <stop offset="1" stop-color="#d9552b"/>
    </linearGradient>
  </defs>

  <!-- 背景: アプリのアクセント色(ティール)の角丸の正方形 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 封筒 -->
  <rect x="96" y="160" width="320" height="224" rx="30" fill="#ffffff"/>
  <path d="M112 188 L256 290 L400 188" fill="none" stroke="#0f5f6e" stroke-opacity="0.28" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 栞: 封筒に挟まり、下へ垂れる。先は燕尾の切り込み -->
  <path d="M318 118 H372 V428 L345 402 L318 428 Z" fill="url(#ribbon)"/>
  <rect x="318" y="118" width="54" height="14" fill="#000000" fill-opacity="0.12"/>

  <!-- 相棒の AI を表す、小さなきらめき -->
  <path d="M168 66 C172 92 180 100 206 104 C180 108 172 116 168 142 C164 116 156 108 130 104 C156 100 164 92 168 66 Z" fill="#ffffff"/>
  <path d="M222 112 C224 124 228 128 240 130 C228 132 224 136 222 148 C220 136 216 132 204 130 C216 128 220 124 222 112 Z" fill="#ffffff" fill-opacity="0.75"/>
</svg>
