<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Shiori Mail">
  <title>Shiori Mail</title>
  <style>
    .line { fill: none; stroke: #4f6e58; stroke-linecap: round; stroke-linejoin: round; }
    /* タブのアイコンはテーマカラーを選べないので、既定の配色(若竹と蔵書印)で描く。暗い画面ではダークモードの明るい色にする */
    @media (prefers-color-scheme: dark) { .line { stroke: #9cc2a5; } }
  </style>

  <!-- 燕尾のリボン栞 -->
  <path class="line" stroke-width="28" d="M150 92 A28 28 0 0 1 178 64 H334 A28 28 0 0 1 362 92 V444 L256 364 L150 444 Z"/>
  <!-- 栞に宿る AI の相棒を表す、4 方向のきらめき -->
  <path class="line" stroke-width="22" d="M256 136 C261 176 274 189 314 194 C274 199 261 212 256 252 C251 212 238 199 198 194 C238 189 251 176 256 136 Z"/>
</svg>
